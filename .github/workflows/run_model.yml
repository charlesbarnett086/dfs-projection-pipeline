name: Run DFS Projection Model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas rapidfuzz nflreadpy

      - name: Execute Model & Sync to Sheets
        env:
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py
