name: Run DFS Projection Model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          python -m pip install --upgrade pip
          pip install requests pandas polars nflreadpy

      - name: Run DFS Pipeline Script
        env:
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py
